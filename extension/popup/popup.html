<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>نوجا</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1>نوجا</h1>
      <p>جستجوی هوشمند خودرو در دیوار</p>
    </div>
  </header>

  <form id="form" autocomplete="off">
    <label class="full">
      <span>چه ماشینی؟</span>
      <input name="query" placeholder="مثلاً: پژو ۲۰۶" required>
    </label>

    <label>
      <span>شهر</span>
      <select name="city">
        <option value="tehran">تهران</option>
        <option value="karaj">کرج</option>
        <option value="mashhad">مشهد</option>
        <option value="isfahan">اصفهان</option>
        <option value="shiraz">شیراز</option>
        <option value="tabriz">تبریز</option>
        <option value="ahvaz">اهواز</option>
        <option value="qom">قم</option>
        <option value="rasht">رشت</option>
        <option value="kermanshah">کرمانشاه</option>
        <option value="urmia">ارومیه</option>
        <option value="kerman">کرمان</option>
        <option value="yazd">یزد</option>
        <option value="hamedan">همدان</option>
        <option value="qazvin">قزوین</option>
        <option value="arak">اراک</option>
        <option value="sari">ساری</option>
        <option value="gorgan">گرگان</option>
        <option value="zanjan">زنجان</option>
        <option value="ardabil">اردبیل</option>
        <option value="bandar-abbas">بندرعباس</option>
        <option value="zahedan">زاهدان</option>
        <option value="iran">سراسر ایران</option>
      </select>
    </label>

    <label>
      <span>کلمهٔ لازم در عنوان</span>
      <input name="keyword" placeholder="مثلاً: 206">
    </label>

    <label>
      <span>مدل از سال</span>
      <input name="yearMin" inputmode="numeric" placeholder="1397 یا 97">
    </label>
    <label>
      <span>تا سال</span>
      <input name="yearMax" inputmode="numeric" placeholder="1397">
    </label>

    <label>
      <span>حداکثر قیمت (تومان)</span>
      <input name="priceMax" inputmode="numeric" placeholder="اختیاری">
    </label>
    <label>
      <span>حداکثر کارکرد (کیلومتر)</span>
      <input name="mileageMax" inputmode="numeric" placeholder="اختیاری">
    </label>

    <label>
      <span>حداکثر تعداد آگهی</span>
      <input name="maxAds" inputmode="numeric" value="300">
    </label>
    <label class="check">
      <input type="checkbox" name="strictYear">
      <span>آگهی‌های بدون سال را حذف کن</span>
    </label>

    <button type="submit" class="primary full">جستجو و بررسی همهٔ آگهی‌ها</button>
  </form>

  <div class="secondary">
    <button id="scanHere" type="button">بررسی همین صفحهٔ دیوار</button>
    <button id="lastResults" type="button">نتایج قبلی</button>
  </div>
  <p id="msg" role="status"></p>
  <p class="hint">نکته: اگر فیلترهای خود دیوار (برند، تیپ، رنگ…) را دستی روی سایت زده‌اید، دکمهٔ «بررسی همین صفحه» را بزنید.</p>

  <script src="../src/parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
